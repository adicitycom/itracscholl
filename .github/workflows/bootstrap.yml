name: Bootstrap Flutter Project (JALANKAN SEKALI SAJA)

# Workflow ini men-generate project Flutter dasar + menimpanya dengan
# file kustom arsitektur multi-sekolah (schools.json, gradle dinamis
# per flavor, dll), lalu commit hasilnya balik ke repo ini.
#
# CATATAN: file .github/workflows/build-android-multi.yml TIDAK
# dibuat lewat workflow ini -- GitHub tidak mengizinkan token Actions
# membuat/mengubah file workflow lain sama sekali (pembatasan
# keamanan, tidak bisa di-override lewat permissions apa pun). File
# itu harus ditambahkan manual sekali, dengan cara yang sama seperti
# menambahkan file bootstrap.yml ini.
#
# Setelah workflow ini sukses jalan SEKALI, HAPUS file ini (lihat
# catatan paling bawah) -- project sudah "jadi", tidak perlu digenerate ulang.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Cek apakah sudah pernah di-bootstrap
        id: check
        run: |
          if [ -f "android_app/android/gradlew" ]; then
            echo "already_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate project Flutter dasar
        if: steps.check.outputs.already_done == 'false'
        run: flutter create --org id.co.sekolahapp --project-name sekolah_app android_app

      - name: Tulis & extract file kustom (overlay) di atas project dasar
