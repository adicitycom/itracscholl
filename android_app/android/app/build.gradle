plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ---------------------------------------------------------------
// Baca schools.json -- INI SATU-SATUNYA TEMPAT daftar sekolah dibaca
// untuk sisi Android. Menambah sekolah baru TIDAK PERLU edit file ini,
// cukup tambah entri baru di ../../schools/schools.json
// ---------------------------------------------------------------
def schoolsJsonFile = file("${projectDir}/../../schools/schools.json")
def schoolsList = new groovy.json.JsonSlurper().parse(schoolsJsonFile)

android {
    namespace "id.co.sekolahapp.sekolah_app" // namespace project (harus sama dengan package di MainActivity.kt), BEDA dari applicationId tiap sekolah
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    flavorDimensions "school"
    productFlavors {
        schoolsList.each { school ->
            create(school.id) {
                dimension "school"
                applicationId school.applicationId
                manifestPlaceholders.put("appName", school.appName)
                resValue "string", "app_name", school.appName
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
