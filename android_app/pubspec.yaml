name: sekolah_app
description: "Aplikasi Android white-label untuk banyak sekolah (1 codebase, banyak flavor)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2

dependency_overrides:
  webview_flutter_android: 4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - schools/schools.json
    
